name: Database Restore Check

on:
  workflow_dispatch:

jobs:
  restore:
    name: PostgreSQL 18 backup and isolated restore
    runs-on: ubuntu-latest
    env:
      SOURCE_DATABASE_URL: ${{ secrets.AUDIT_SOURCE_DATABASE_URL }}
      RESTORE_DATABASE_URL: ${{ secrets.AUDIT_RESTORE_DATABASE_URL }}
      SECRET_KEY: audit-only-secret-key-with-more-than-32-characters
    steps:
      - uses: actions/checkout@v7

      - name: Require isolated direct connections
        run: |
          test -n "$SOURCE_DATABASE_URL"
          test -n "$RESTORE_DATABASE_URL"
          test "$SOURCE_DATABASE_URL" != "$RESTORE_DATABASE_URL"
          case "$SOURCE_DATABASE_URL$RESTORE_DATABASE_URL" in *-pooler*) exit 1;; esac

      - name: Create PostgreSQL 18 dump
        run: |
          mkdir -p backups
          docker run --rm -e DATABASE_URL="$SOURCE_DATABASE_URL" -v "$PWD/backups:/backups" postgres:18-alpine sh -c 'pg_dump "$DATABASE_URL" -Fc -f /backups/rumbo.dump'
          test -s backups/rumbo.dump

      - name: Restore only into the isolated target
        run: |
          docker run --rm -e DATABASE_URL="$RESTORE_DATABASE_URL" -v "$PWD/backups:/backups" postgres:18-alpine sh -c 'pg_restore --clean --if-exists --no-owner --no-privileges -d "$DATABASE_URL" /backups/rumbo.dump'

      - name: Compare revision and relevant counts
        run: |
          query="SELECT version_num,(SELECT count(*) FROM users),(SELECT count(*) FROM daily_checkins),(SELECT count(*) FROM habit_logs),(SELECT count(*) FROM habits),(SELECT count(*) FROM habit_library) FROM alembic_version"
          source_counts=$(docker run --rm -e DATABASE_URL="$SOURCE_DATABASE_URL" postgres:18-alpine sh -c 'psql "$DATABASE_URL" -At -F"," -c "$1"' sh "$query")
          restore_counts=$(docker run --rm -e DATABASE_URL="$RESTORE_DATABASE_URL" postgres:18-alpine sh -c 'psql "$DATABASE_URL" -At -F"," -c "$1"' sh "$query")
          test "$source_counts" = "$restore_counts"
          echo "Revision and counts match: $restore_counts"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify register and login through the restored application
        working-directory: backend
        run: |
          pip install -r requirements.txt
          export DATABASE_URL="${RESTORE_DATABASE_URL/postgresql:\/\//postgresql+psycopg:\/\/}"
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/rumbo-restore-api.log 2>&1 &
          api_pid=$!
          trap 'kill $api_pid 2>/dev/null || true; rm -f ../backups/rumbo.dump' EXIT
          python - <<'PY'
          import json, os, time, urllib.request

          def request(path, payload=None):
              body = json.dumps(payload).encode() if payload else None
              req = urllib.request.Request(f"http://127.0.0.1:8000/api{path}", data=body, headers={"Content-Type": "application/json"})
              with urllib.request.urlopen(req, timeout=10) as response:
                  return response.status, json.loads(response.read())

          for _ in range(30):
              try:
                  if request("/health")[0] == 200:
                      break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit("restored API did not start")

          credentials = {"email": f"restore-check-{os.environ['GITHUB_RUN_ID']}@example.com", "password": "restore-check-123", "display_name": "Restore Check"}
          status, registered = request("/auth/register", credentials)
          assert status == 201 and registered.get("access_token")
          status, logged_in = request("/auth/login", {"email": credentials["email"], "password": credentials["password"]})
          assert status == 200 and logged_in.get("access_token")
          print("Restored API register/login check passed")
          PY

      - name: Remove dump from runner
        if: always()
        run: rm -f backups/rumbo.dump
