services:
  migrations:
    build: ./backend
    command: python -m alembic upgrade head
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.home}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env.home}
      ENVIRONMENT: production
    restart: "no"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.home}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env.home}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      BACKEND_CORS_ORIGINS: https://${RUMBO_HOST:?Set RUMBO_HOST in .env.home}
      ENVIRONMENT: production
    depends_on:
      migrations:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    depends_on:
      - backend
    restart: unless-stopped

  caddy:
    image: caddy:2.10-alpine
    environment:
      RUMBO_HOST: ${RUMBO_HOST:?Set RUMBO_HOST in .env.home}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
